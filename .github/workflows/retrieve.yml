name: Retrieve official source snapshot for review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/acquire.py
      - uses: actions/upload-artifact@v4
        with:
          name: official-records-for-editorial-review
          path: |
            data/raw
            data/sources.json
# No automatic publication or scheduled runs until source stability and editorial review are established.
