name: Deploy UtahBills to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Run the guarded daily data refresh now
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    outputs:
      calendar_result: ${{ steps.calendar_refresh.outcome }}
      catalog_result: ${{ steps.catalog_refresh.outcome }}
      text_result: ${{ steps.text_refresh.outcome }}
      archive_result: ${{ steps.archive_refresh.outcome }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify reproducible UTF-8 source analysis
        run: python3 scripts/analyze.py --check
      - name: Refresh official calendar
        id: calendar_refresh
        if: github.event_name == 'schedule' || inputs.refresh_data == true
        continue-on-error: true
        run: |
          mkdir -p test-results
          set -o pipefail
          python3 scripts/refresh_calendar.py 2>&1 | tee test-results/calendar-refresh.log
      - name: Refresh 2027 legislation and requests
        id: catalog_refresh
        if: github.event_name == 'schedule' || inputs.refresh_data == true
        continue-on-error: true
        run: python3 scripts/refresh_catalog.py
      - name: Acquire bounded verified 2027 text
        id: text_refresh
        if: (github.event_name == 'schedule' || inputs.refresh_data == true) && steps.catalog_refresh.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/refresh_text.py
      - name: Refresh official vote records
        id: archive_refresh
        if: (github.event_name == 'schedule' || inputs.refresh_data == true) && steps.catalog_refresh.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/refresh_archive.py
      - name: Preserve refresh attempt reports
        if: always() && (github.event_name == 'schedule' || inputs.refresh_data == true)
        uses: actions/upload-artifact@v4
        with:
          name: refresh-attempt-${{ github.run_id }}
          path: |
            test-results/text-refresh.json
            test-results/catalog-refresh.json
            test-results/calendar-refresh.log
            test-results/archive-refresh.json
          retention-days: 90
      - name: Report independent refresh outcomes
        if: always() && (github.event_name == 'schedule' || inputs.refresh_data == true)
        env:
          CALENDAR_RESULT: ${{ steps.calendar_refresh.outcome }}
          TEXT_RESULT: ${{ steps.text_refresh.outcome }}
          CATALOG_RESULT: ${{ steps.catalog_refresh.outcome }}
          ARCHIVE_RESULT: ${{ steps.archive_refresh.outcome }}
        run: |
          if [ -f test-results/catalog-refresh.json ]; then
            python3 -c "import json; r=json.load(open('test-results/catalog-refresh.json')); print('Catalog reconciliation:',r['status'],r.get('reconciliation',{}))" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "2027 text acquisition step: $TEXT_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-results/text-refresh.json ]; then
            python3 -c "import json; r=json.load(open('test-results/text-refresh.json')); print('2027 text acquisition:',r['status'],r.get('counts',{}))" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Calendar refresh: $CALENDAR_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "2027 catalog step (publishable snapshot, not full reconciliation): $CATALOG_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Vote archive refresh: $ARCHIVE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Failed retrievals retain the previous snapshot. Download refresh-attempt artifacts for diagnostics.' >> "$GITHUB_STEP_SUMMARY"
          if [ "$CALENDAR_RESULT" = failure ] || [ "$CATALOG_RESULT" = failure ] || [ "$ARCHIVE_RESULT" = failure ] || [ "$TEXT_RESULT" = failure ]; then
            echo '::warning::An official-source refresh failed; previous verified data is retained. See refresh reports.'
          fi
      - name: Verify calendar provenance and failure safeguards
        run: python3 tests/calendar_data.py
      - name: Verify bill catalog provenance and associations
        run: |
          python3 tests/catalog_data.py
          python3 tests/catalog_updates.py
          python3 tests/request_publication.py
          python3 tests/foundation_data.py
          python3 tests/activity_data.py
          python3 tests/version_data.py
          python3 tests/text_acquisition.py
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Functional and accessibility checks
        run: |
          npm start > /tmp/utahbills-preview.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/UtahBills/ && break || sleep 1; done
          npm test
      - name: Preserve tested snapshots
        if: github.event_name == 'schedule' || inputs.refresh_data == true
        env:
          TEXT_RESULT: ${{ steps.text_refresh.outcome }}
          CATALOG_RESULT: ${{ steps.catalog_refresh.outcome }}
          ARCHIVE_RESULT: ${{ steps.archive_refresh.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/calendar.json data/verification-report.json
          if [ "$CATALOG_RESULT" = success ]; then
            git add data/catalog.json data/catalog-raw/
          fi
          if [ "$TEXT_RESULT" = success ]; then
            git add data/text-2027.json data/text-2027-raw/
          fi
          if [ "$ARCHIVE_RESULT" = success ]; then
            git add data/archive.json data/archive-raw/
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified legislative snapshots'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  refresh_health:
    needs: build
    if: always() && (needs.build.outputs.calendar_result == 'failure' || needs.build.outputs.catalog_result == 'failure' || needs.build.outputs.archive_result == 'failure' || needs.build.outputs.text_result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Flag unsuccessful refresh without blocking the independent valid snapshot
        run: |
          echo '::error::An official-source refresh failed. Previous data was retained; see build summary and refresh-attempt artifact.'
          exit 1
