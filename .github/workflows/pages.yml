name: Deploy UtahBills to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify reproducible UTF-8 source analysis
        run: python3 scripts/analyze.py --check
      - name: Refresh official calendar (daily run only)
        if: github.event_name == 'schedule'
        run: python3 scripts/refresh_calendar.py
      - name: Verify calendar provenance and failure safeguards
        run: python3 tests/calendar_data.py
      - name: Verify bill catalog provenance and associations
        run: python3 tests/catalog_data.py
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Functional and accessibility checks
        run: |
          npm start > /tmp/utahbills-preview.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/UtahBills/ && break || sleep 1; done
          npm test
      - name: Preserve tested calendar snapshot
        if: github.event_name == 'schedule'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/calendar.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified calendar snapshot'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
